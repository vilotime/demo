<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="md 目录经构建生成静态站点的示意图">
  <rect x="0" y="0" width="760" height="240" rx="16" fill="#eef2ff"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="32" y="40" font-size="15" font-weight="600" fill="#1e293b">构建流程</text>
    <text x="32" y="62" font-size="12" fill="#64748b">md/ 里的文件在构建时被扫描成一份目录清单</text>

    <rect x="32" y="84" width="180" height="120" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="52" y="112" font-size="13" font-weight="600" fill="#334155">md/</text>
    <text x="52" y="136" font-size="12" fill="#64748b">index.md</text>
    <text x="52" y="156" font-size="12" fill="#64748b">指南/01-快速开始.md</text>
    <text x="52" y="176" font-size="12" fill="#64748b">示例/…….md</text>

    <path d="M220 144 L268 144" stroke="#818cf8" stroke-width="2" fill="none"/>
    <path d="M262 138 L272 144 L262 150" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="280" y="94" width="180" height="100" rx="12" fill="#4f46e5"/>
    <text x="300" y="126" font-size="13" font-weight="600" fill="#ffffff">build-index</text>
    <text x="300" y="148" font-size="11.5" fill="#c7d2fe">node tools/build-index.mjs</text>
    <text x="300" y="170" font-size="11.5" fill="#c7d2fe">生成 md-index.json</text>

    <path d="M468 144 L516 144" stroke="#818cf8" stroke-width="2" fill="none"/>
    <path d="M510 138 L520 144 L510 150" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="528" y="94" width="200" height="100" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="548" y="126" font-size="13" font-weight="600" fill="#334155">静态站点</text>
    <text x="548" y="148" font-size="12" fill="#64748b">index.html + assets/</text>
    <text x="548" y="170" font-size="12" fill="#64748b">md-index.json + md/</text>

    <text x="32" y="228" font-size="11.5" fill="#94a3b8">GitHub Pages 只提供静态文件，所以目录树必须在构建阶段确定下来。</text>
  </g>
</svg>
