<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MD Pages · 文档</title>
    <meta
      name="description"
      content="基于 Markdown 的静态文档站点：左侧目录树浏览 md/ 文件夹，支持阅读模式与演示模式。"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/site.css" />
    <script>
      /* 尽早确定主题，避免首屏闪白 */
      (function () {
        try {
          var saved = localStorage.getItem('mdpages:theme');
          if (!saved) {
            saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = saved;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <!-- ===================== 侧边栏：目录树 ===================== -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__head">
          <a class="brand" href="#/" id="brand">
            <span class="brand__mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 0 4 21.5z" />
                <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20" />
              </svg>
            </span>
            <span class="brand__text">
              <strong id="brand-title">MD Pages</strong>
              <small id="brand-sub">Markdown 文档站</small>
            </span>
          </a>
          <button class="icon-btn sidebar__close" id="sidebar-close" type="button" aria-label="收起目录">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M15 6l-6 6 6 6" />
            </svg>
          </button>
        </div>

        <div class="search" role="search">
          <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input
            id="search"
            type="search"
            class="search__input"
            placeholder="搜索文档…"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="搜索文档"
          />
          <button class="search__clear" id="search-clear" type="button" aria-label="清除搜索" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>

        <nav class="tree" id="tree" aria-label="文档目录">
          <p class="tree__placeholder">正在读取目录…</p>
        </nav>

        <div class="sidebar__foot">
          <span class="sidebar__stats" id="stats"></span>
          <div class="sidebar__foot-actions">
            <button class="icon-btn" id="theme-toggle" type="button" title="切换深色 / 浅色" aria-label="切换主题">
              <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="12" r="4.2" />
                <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
              </svg>
              <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
              </svg>
            </button>
          </div>
        </div>
      </aside>

      <div class="scrim" id="scrim" hidden></div>

      <!-- ===================== 主区域 ===================== -->
      <main class="main" id="main">
        <header class="topbar">
          <button class="icon-btn topbar__menu" id="menu-btn" type="button" aria-label="打开目录">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>

          <nav class="crumbs" id="crumbs" aria-label="文档位置"></nav>

          <div class="topbar__actions">
            <button class="icon-btn" id="copy-link" type="button" title="复制当前链接" aria-label="复制当前链接">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1" />
                <path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1" />
              </svg>
            </button>
            <a class="icon-btn" id="raw-link" href="#" target="_blank" rel="noopener" title="查看原始 Markdown" aria-label="查看原始 Markdown">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 8-4 4 4 4M15 8l4 4-4 4" />
              </svg>
            </a>
            <button class="icon-btn" id="print-btn" type="button" title="打印 / 导出 PDF" aria-label="打印">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 9V4h10v5" />
                <path d="M5 9h14a1 1 0 0 1 1 1v6a2 2 0 0 1-2 2h-1v-4H7v4H6a2 2 0 0 1-2-2v-6a1 1 0 0 1 1-1Z" />
              </svg>
            </button>
            <button class="btn btn--accent" id="mode-toggle" type="button" title="切换到演示模式（Ctrl/⌘ + Enter）">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" /></svg>
              <span>演示</span>
            </button>
          </div>
        </header>

        <div class="workspace">
          <div class="reader" id="reader" tabindex="-1">
            <article class="doc" id="doc"></article>
          </div>

          <aside class="toc" id="toc" aria-label="本页大纲">
            <p class="toc__title">本页大纲</p>
            <nav class="toc__list" id="toc-list"></nav>
          </aside>

          <section class="welcome" id="welcome" hidden></section>
        </div>

        <button class="to-top" id="to-top" type="button" aria-label="回到顶部" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V6M6 12l6-6 6 6" />
          </svg>
        </button>
      </main>
    </div>

    <!-- ===================== 演示模式 ===================== -->
    <div class="deck" id="deck" hidden aria-hidden="true" role="dialog" aria-label="演示模式">
      <div class="deck__stage" id="deck-stage">
        <div class="deck__frame" id="deck-frame">
          <div class="deck__viewport" id="deck-viewport">
            <div class="deck__track" id="deck-track"></div>
          </div>
        </div>
      </div>

      <button class="deck__nav deck__nav--prev" id="deck-prev" type="button" aria-label="上一页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 6l-6 6 6 6" />
        </svg>
      </button>
      <button class="deck__nav deck__nav--next" id="deck-next" type="button" aria-label="下一页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 6l6 6-6 6" />
        </svg>
      </button>

      <div class="deck__proof" aria-hidden="true"><span id="deck-progress"></span></div>

      <div class="deck__chrome">
        <div class="deck__bar">
          <span class="deck__title" id="deck-title"></span>
          <span class="deck__counter" id="deck-counter">1 / 1</span>
          <div class="deck__buttons">
            <button class="deck__btn" id="deck-overview-btn" type="button" title="幻灯片总览（o）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                <rect x="3" y="4" width="7" height="7" rx="1.4" />
                <rect x="14" y="4" width="7" height="7" rx="1.4" />
                <rect x="3" y="14" width="7" height="7" rx="1.4" />
                <rect x="14" y="14" width="7" height="7" rx="1.4" />
              </svg>
            </button>
            <button class="deck__btn" id="deck-fullscreen" type="button" title="全屏（f）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3" />
              </svg>
            </button>
            <button class="deck__btn deck__btn--exit" id="deck-exit" type="button" title="退出演示（Esc）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
              <span>退出</span>
            </button>
          </div>
        </div>
      </div>

      <div class="deck__overview" id="deck-overview" hidden>
        <div class="deck__overview-grid" id="deck-overview-grid"></div>
      </div>
    </div>

    <!-- 图片放大 -->
    <div class="lightbox" id="lightbox" hidden role="dialog" aria-label="图片预览">
      <img id="lightbox-img" alt="" />
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="assets/vendor/marked.min.js"></script>
    <script src="assets/vendor/highlight.min.js"></script>
    <script src="assets/js/markdown.js"></script>
    <script src="assets/js/presenter.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
